# ============================================================
# SMS Sideloading Spam Detector — Configuration
# Problem: "Fake mobile apps circulated via SMS/WhatsApp,
#           leading to phishing and financial fraud."
# ============================================================

paths:
  project_root:        "/scratch/m25cse012/sms_spam_detector_v2"
  raw_data_dir:        "/scratch/m25cse012/sms_spam_detector_v2/data/raw"
  processed_data_dir:  "/scratch/m25cse012/sms_spam_detector_v2/data/processed"
  synthetic_data_dir:  "/scratch/m25cse012/sms_spam_detector_v2/data/synthetic"
  checkpoint_dir:      "/scratch/m25cse012/sms_spam_detector_v2/checkpoints"
  log_dir:             "/scratch/m25cse012/sms_spam_detector_v2/logs"
  hf_cache_dir:        "/scratch/m25cse012/hf_cache"
  blocklist_path:      "/scratch/m25cse012/sms_spam_detector_v2/data/blocklist/malicious_domains.txt"

model:
  name:                "ai4bharat/indic-bert"
  max_seq_length:      256
  num_labels:          2
  label_map:
    0: "ham"
    1: "spam"
  use_auxiliary_features: true
  # IMPORTANT: must match len(ExtractionResult.to_feature_vector())
  # 29 text heuristics + 10 URL intelligence dims = 39
  auxiliary_feature_dim: 39
  fusion_hidden_dim:   256
  dropout:             0.3

training:
  epochs:                      10
  batch_size:                  32
  learning_rate:               2.0e-5
  weight_decay:                0.01
  warmup_ratio:                0.1
  fp16:                        true
  gradient_accumulation_steps: 2
  early_stopping_patience:     3
  save_total_limit:            3
  seed:                        42
  logging_steps:               50
  eval_steps:                  200

loss:
  type:  "focal"
  alpha: 0.75
  gamma: 2.0

evaluation:
  metrics:
    - accuracy
    - f1
    - precision
    - recall
    - auc_roc
  threshold_sweep_steps: 100
  target_recall: 0.99

data:
  test_size:                 0.1
  val_size:                  0.1
  stratify_by_language:      true
  max_synthetic_per_template: 5

languages:
  - {code: "en",      name: "English"}
  - {code: "hi",      name: "Hindi"}
  - {code: "bn",      name: "Bengali"}
  - {code: "ta",      name: "Tamil"}
  - {code: "te",      name: "Telugu"}
  - {code: "mr",      name: "Marathi"}
  - {code: "kn",      name: "Kannada"}
  - {code: "ml",      name: "Malayalam"}
  - {code: "pa",      name: "Punjabi"}
  - {code: "gu",      name: "Gujarati"}
  - {code: "or",      name: "Odia"}
  - {code: "ur",      name: "Urdu"}
  - {code: "hi-Latn", name: "Hinglish (Romanized)"}

url_shorteners:
