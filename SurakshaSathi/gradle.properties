# ── Drive Configuration (C drive full — all toolchain on D/E drive) ─────────────
# IMPORTANT: Use forward slashes in Java .properties files.
# Backslashes cause parsing bugs — D:\path → use D:/path instead.

# Gradle user home → D drive (caches, JDKs, wrapper dists all land here)
org.gradle.user.home=D:/.gradle

# JDK 21 (Temurin) auto-provisioned by Gradle into D:/.gradle/jdks
# This lets gradlew.bat work without JAVA_HOME being set in the environment
org.gradle.java.home=D:/.gradle/jdks/eclipse_adoptium-21-amd64-windows.2

# JVM args — 4 GB heap; all temp files stay off C drive
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:/tmp

# Performance
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Android
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=false
